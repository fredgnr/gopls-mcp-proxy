name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Release packages
    uses: ./.github/workflows/build.yml

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.25.x'
            integration: false
          - os: ubuntu-latest
            go: '1.27.2'
            integration: true
          - os: macos-latest
            go: '1.27.2'
            integration: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and protocol components (race)
        shell: bash
        run: |
          mkdir -p test-results
          go test -race -json ./cmd/... ./internal/... -count=1 | tee test-results/unit.json
      - name: Raw backend independent refresh and protocol contract (required)
        env:
          PROXY_TEST_EVIDENCE_DIR: ${{ runner.temp }}/proxy-evidence
        shell: bash
        run: go test -race -json ./integration -run '^TestRaw' -count=1 | tee test-results/raw-contract.json
      - run: go build ./cmd/gopls-mcp-proxy
      - name: Install pinned gopls
        if: matrix.integration
        run: go install golang.org/x/tools/gopls@v0.24.0
      - name: Real gopls interoperability and proxy-owned content refresh
        if: matrix.integration
        env:
          GOPLS_INTEGRATION: '1'
          PROXY_TEST_EVIDENCE_DIR: ${{ runner.temp }}/proxy-evidence
        shell: bash
        run: go test -json ./integration -run '^TestRealGopls' -count=1 | tee test-results/real-gopls.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}-go-${{ matrix.go }}
          path: |
            test-results/*.json
            ${{ runner.temp }}/proxy-evidence/**
          if-no-files-found: ignore
          retention-days: 14
