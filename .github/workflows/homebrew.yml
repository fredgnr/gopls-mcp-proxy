name: Publish Homebrew

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.7.0)
        required: true
        type: string
      publish:
        description: Update the tap after all installation checks pass
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        default: true
        type: boolean
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: homebrew-${{ inputs.publish && 'publish' || github.ref }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  prepare:
    name: Verify published assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test release automation
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_homebrew*.py' -v
      - name: Download and verify the published release and upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/homebrew/prepare.py --tag "$RELEASE_TAG" --output-dir homebrew-dist
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, "scripts/homebrew")
          from generate import stable_version
          from prepare import prepare

          baseline = "v0.6.0"
          if stable_version(os.environ["RELEASE_TAG"]) > stable_version(baseline):
              formula = prepare(baseline, Path("homebrew-baseline"))
              shutil.copyfile(formula, "homebrew-dist/gopls-mcp-proxy-baseline.rb")
          else:
              print(f"Skipping upgrade test: candidate does not follow {baseline}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-candidate
          path: |
            homebrew-dist/gopls-mcp-proxy.rb
            homebrew-dist/gopls-mcp-proxy-baseline.rb
            homebrew-dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  test:
    name: Homebrew (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # Keep dependencies between the clean-install and upgrade scenarios.
      # Intel macOS may need to compile Go/gopls when core has no bottles.
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homebrew-candidate
          path: candidate
      - name: Install and exercise the candidate formula
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new fredgnr/ci
          cp candidate/gopls-mcp-proxy.rb "$(brew --repository fredgnr/ci)/Formula/gopls-mcp-proxy.rb"
          brew style fredgnr/ci/gopls-mcp-proxy
          brew install fredgnr/ci/gopls-mcp-proxy
          brew audit --strict fredgnr/ci/gopls-mcp-proxy
          brew test fredgnr/ci/gopls-mcp-proxy
          brew uninstall gopls-mcp-proxy
          test ! -e "$(brew --prefix)/bin/gopls-mcp-proxy"
      - name: Upgrade the installed baseline through the stable command path
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! -f candidate/gopls-mcp-proxy-baseline.rb ]]; then
            echo 'Candidate is not newer than the v0.6.0 upgrade baseline; clean installation was tested.'
            exit 0
          fi
          formula="$(brew --repository fredgnr/ci)/Formula/gopls-mcp-proxy.rb"
          stable_command="$(brew --prefix)/bin/gopls-mcp-proxy"
          cp candidate/gopls-mcp-proxy-baseline.rb "$formula"
          brew install fredgnr/ci/gopls-mcp-proxy
          baseline_version="$("$stable_command" --version 2>&1)"
          [[ "$baseline_version" == 'gopls-mcp-proxy v0.6.0 (commit '* ]]
          cp candidate/gopls-mcp-proxy.rb "$formula"
          brew upgrade fredgnr/ci/gopls-mcp-proxy
          candidate_version="$("$stable_command" --version 2>&1)"
          expected_prefix="gopls-mcp-proxy $RELEASE_TAG (commit "
          [[ "$candidate_version" == "$expected_prefix"* ]]
          brew test fredgnr/ci/gopls-mcp-proxy
          brew uninstall gopls-mcp-proxy
          test ! -e "$stable_command"
          test ! -L "$stable_command"

  publish:
    name: Update the stable tap
    if: inputs.publish
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: homebrew-candidate
          path: homebrew-dist
      - name: Publish tested formula with rollback and concurrent-edit protection
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Add HOMEBREW_TAP_TOKEN to this repository: a fine-grained PAT for fredgnr/homebrew-tap with Contents: read/write. See docs/homebrew-release.md.'
            exit 1
          fi
          python3 scripts/homebrew/publish.py --tag "$RELEASE_TAG" \
            --formula homebrew-dist/gopls-mcp-proxy.rb --checksums homebrew-dist/checksums.txt
