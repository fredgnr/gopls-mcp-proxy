name: Release

on:
  push:
    tags: ['v*']
  # Manual runs validate and upload artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Collect workflow telemetry
        uses: ycfreeman/workflow-telemetry-action@72ec425db8a31670fdc4419966940a6d980a0b49 # v3.0.2
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          metric_frequency: '5'
          comment_on_pr: 'false'
          job_summary: 'true'
          proc_trace_chart_show: 'false'
          proc_trace_table_show: 'false'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
      - name: Export workflow telemetry
        id: telemetry-export
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: python3 scripts/export-workflow-telemetry.py
      - name: Upload workflow telemetry
        if: always() && steps.telemetry-export.outputs.file != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.telemetry-export.outputs.artifact }}
          path: ${{ steps.telemetry-export.outputs.file }}
          if-no-files-found: error
          retention-days: 7
