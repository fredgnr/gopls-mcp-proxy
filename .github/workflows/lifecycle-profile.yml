name: Lifecycle soak profile

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Calls per lifecycle mode (3 to 1000)
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        gopls: [v0.23.0, v0.24.0]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install pinned gopls
        run: go install golang.org/x/tools/gopls@${{ matrix.gopls }}
      - name: Record source
        shell: bash
        run: |
          mkdir -p test-results
          python3 - <<'PY'
          import json, os, platform, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          data = {"revision": run("git", "rev-parse", "HEAD"), "tree": run("git", "rev-parse", "HEAD^{tree}"), "go": run("go", "version"), "platform": platform.platform(), "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "scope": "synthetic single-session correctness/soak; not a controlled production memory benchmark"}
          with open("test-results/source.json", "w") as f:
              json.dump(data, f, indent=2)
          PY
      - name: Real gopls lifecycle soak (without race instrumentation)
        env:
          GOPLS_INTEGRATION: '1'
          GOPLS_EXPECTED_VERSION: ${{ matrix.gopls }}
          GOPLS_LIFECYCLE_CYCLES: ${{ inputs.cycles }}
          PROXY_TEST_EVIDENCE_DIR: ${{ runner.temp }}/proxy-evidence
        shell: bash
        run: |
          go test -json ./integration -run '^TestRealGoplsOnDemand(Lifecycle|KilledParentSidecarExit)$' -count=1 -timeout=40m | tee test-results/lifecycle.json
          python3 scripts/check-lifecycle-tests.py real test-results/lifecycle.json "$PROXY_TEST_EVIDENCE_DIR" > test-results/lifecycle-gate.json
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lifecycle-${{ matrix.os }}-${{ matrix.gopls }}
          path: |
            test-results/*.json
            ${{ runner.temp }}/proxy-evidence/**
          if-no-files-found: error
          retention-days: 14
