name: Release

on:
  push:
    tags: ['v*']
  # Manual runs validate and upload artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: dist
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
