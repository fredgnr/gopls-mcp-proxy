name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Release packages
    uses: ./.github/workflows/build.yml

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }}, gopls ${{ matrix.gopls }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.25.x'
            integration: false
            gopls: none
          - os: ubuntu-latest
            go: '1.27.2'
            integration: true
            gopls: v0.23.0
          - os: ubuntu-latest
            go: '1.27.2'
            integration: true
            gopls: v0.24.0
          - os: macos-latest
            go: '1.27.2'
            integration: true
            gopls: v0.23.0
          - os: macos-latest
            go: '1.27.2'
            integration: true
            gopls: v0.24.0
    steps:
      - name: Collect workflow telemetry
        uses: ycfreeman/workflow-telemetry-action@72ec425db8a31670fdc4419966940a6d980a0b49 # v3.0.2
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          metric_frequency: '5'
          comment_on_pr: 'false'
          job_summary: 'true'
          proc_trace_chart_show: 'false'
          proc_trace_table_show: 'false'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test telemetry exporter
        if: matrix.integration == false
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_telemetry_export.py' -v
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Record tested source and runner identity
        shell: bash
        run: |
          mkdir -p test-results
          python3 - <<'PY'
          import datetime, json, os, platform, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          metadata = {
              "recorded_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "revision": command("git", "rev-parse", "HEAD"),
              "tree": command("git", "rev-parse", "HEAD^{tree}"),
              "worktree": command("git", "status", "--porcelain"),
              "go": command("go", "version"),
              "platform": platform.platform(), "architecture": platform.machine(),
              "uid": os.getuid(), "cpu_count": os.cpu_count(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "real_codex_status": "pending: this job does not run a Codex client"
          }
          with open("test-results/source.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY
      - name: Unit and protocol components (race)
        shell: bash
        run: |
          mkdir -p test-results
          go test -race -json ./cmd/... ./internal/... -count=1 | tee test-results/unit.json
          python3 scripts/check-launcher-tests.py unit test-results/unit.json > test-results/launcher-unit.json
      - name: Raw backend independent refresh and protocol contract (required)
        env:
          PROXY_TEST_EVIDENCE_DIR: ${{ runner.temp }}/proxy-evidence
        shell: bash
        run: |
          go test -race -json ./integration -run '^TestRaw' -count=1 | tee test-results/raw-contract.json
          python3 scripts/check-launcher-tests.py raw test-results/raw-contract.json > test-results/launcher-raw.json
      - run: go build ./cmd/gopls-mcp-proxy
      - name: Install pinned gopls
        if: matrix.integration
        run: go install golang.org/x/tools/gopls@${{ matrix.gopls }}
      - name: Real gopls interoperability and proxy-owned content refresh
        if: matrix.integration
        env:
          GOPLS_INTEGRATION: '1'
          GOPLS_EXPECTED_VERSION: ${{ matrix.gopls }}
          PROXY_TEST_EVIDENCE_DIR: ${{ runner.temp }}/proxy-evidence
        shell: bash
        run: |
          go test -json ./integration -run '^TestRealGopls' -count=1 | tee test-results/real-gopls.json
          python3 scripts/check-launcher-tests.py real test-results/real-gopls.json > test-results/launcher-real.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}-go-${{ matrix.go }}-gopls-${{ matrix.gopls }}
          path: |
            test-results/*.json
            ${{ runner.temp }}/proxy-evidence/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Export workflow telemetry
        id: telemetry-export
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: python3 scripts/export-workflow-telemetry.py
      - name: Upload workflow telemetry
        if: always() && steps.telemetry-export.outputs.file != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.telemetry-export.outputs.artifact }}
          path: ${{ steps.telemetry-export.outputs.file }}
          if-no-files-found: error
          retention-days: 7
